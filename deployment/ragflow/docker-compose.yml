services:
  es01:
    image: elasticsearch:${STACK_VERSION}
    volumes:
    - ../../.runtime/ragflow/esdata01:/usr/share/elasticsearch/data
    tmpfs:
    - /tmp:mode=1777,size=512m
    env_file: ./.env
    environment:
    - node.name=es01
    - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    - bootstrap.memory_lock=false
    - discovery.type=single-node
    - xpack.security.enabled=true
    - xpack.security.http.ssl.enabled=false
    - xpack.security.transport.ssl.enabled=false
    - cluster.routing.allocation.disk.watermark.low=5gb
    - cluster.routing.allocation.disk.watermark.high=3gb
    - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
      - CMD-SHELL
      - curl http://localhost:9200
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
    - ragflow
    restart: unless-stopped
    logging:
      driver: none
  mysql:
    image: mysql:8.0.40
    env_file: ./.env
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    command: --max_connections=1000 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql --binlog_expire_logs_seconds=604800
    volumes:
    - ../../.runtime/ragflow/mysql_data:/var/lib/mysql
    - ./upstream/init.sql:/data/application/init.sql
    networks:
    - ragflow
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -uroot
      - -p${MYSQL_PASSWORD}
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
    logging:
      driver: none
  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command:
    - server
    - --console-address
    - :9001
    - /data
    env_file: ./.env
    environment:
    - MINIO_ROOT_USER=${MINIO_USER}
    - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
    - ../../.runtime/ragflow/minio_data:/data
    networks:
    - ragflow
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 10s
      retries: 120
    logging:
      driver: none
  redis:
    image: valkey/valkey:8
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - volatile-lru
    env_file: ./.env
    volumes:
    - ../../.runtime/ragflow/redis_data:/data
    networks:
    - ragflow
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 10s
      retries: 120
    logging:
      driver: none
  ragflow-cpu:
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    command:
    - --init-model-provider-tables
    ports:
    - 127.0.0.1:9380:9380
    - 127.0.0.1:8080:80
    environment:
    - SANDBOX_EXECUTOR_MANAGER_API_TOKEN=${SANDBOX_EXECUTOR_MANAGER_API_TOKEN:-}
    volumes:
    - ../../.runtime/ragflow/logs:/ragflow/logs
    - ./upstream/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
    - ./upstream/entrypoint.sh:/ragflow/entrypoint.sh
    env_file: ./.env
    networks:
    - ragflow
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway
    logging:
      driver: none
networks:
  ragflow:
    driver: bridge
    internal: true
